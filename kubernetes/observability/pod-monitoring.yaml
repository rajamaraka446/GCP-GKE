apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: webapp-a-metrics
  namespace: production
spec:
  selector:
    matchLabels:
      app: webapp-a
  endpoints:
  - port: 8080
    path: /metrics
    interval: 30s
---
