apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webapp-b-hpa
  namespace: production

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webapp-b

  minReplicas: 3
  maxReplicas: 12

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65

  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
